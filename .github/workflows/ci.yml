name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  root-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: legacy/ai20k-template/requirements.txt
      - run: pip install -r legacy/ai20k-template/requirements.txt
      - run: ruff check src tests
        working-directory: legacy/ai20k-template
      - run: pytest -q
        working-directory: legacy/ai20k-template
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run check

  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_DATA_SOURCE: mock
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize non-secret configuration templates
        run: |
          cp apps/backend/.env.example apps/backend/.env
          cp apps/frontend/.env.example apps/frontend/.env
      - run: docker compose config --quiet
