name: Deploy AI to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "apps/ai/**"
      - ".github/workflows/deploy-ai.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-ai-production
  cancel-in-progress: true

env:
  PROJECT_ID: project-5d300c02-d165-4037-b6f
  REGION: asia-southeast1
  REPOSITORY: cloud-run-source-deploy
  SERVICE: gsm-ai

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/113955822006/locations/global/workloadIdentityPools/github-gsm/providers/github
          service_account: github-gsm-deployer@project-5d300c02-d165-4037-b6f.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        shell: bash
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --tag "${IMAGE}" apps/ai
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --quiet

      - name: Verify health
        shell: bash
        run: |
          URL="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')"
          curl --fail --retry 8 --retry-delay 5 --retry-all-errors "${URL}/health"
