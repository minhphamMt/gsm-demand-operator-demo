# Cấu hình công cụ ở gốc repo.
#
# Repo là monorepo apps/ai + apps/backend + apps/frontend (mỗi app có runner/lint/test
# riêng, xem Makefile và .github/workflows/ci.yml). Không còn pipeline Python nào chạy
# ở gốc repo kể từ khi src/, tests/ ở gốc bị xoá (issue #14 — bản sao chết của apps/ai).
#
# Khối pytest dưới đây CHỈ để chặn `legacy/ai20k-template` khỏi bị quét nhầm nếu ai đó
# chạy `pytest` từ gốc repo không kèm path — thư mục đó là starter scaffold cũ, cố ý giữ
# lại để tham khảo (xem README.md) nhưng import gãy (thiếu package `src` riêng khi chạy
# ngoài context của nó), nên gộp vào một lượt collect chung sẽ báo lỗi hoặc làm sai lệch
# số ca test đếm được.

[tool.pytest.ini_options]
testpaths = []
# norecursedirs GHI ĐÈ toàn bộ default của pytest (không cộng dồn) — phải liệt kê lại
# "*.egg", ".*", "build", "dist", "node_modules", "venv" (default) cùng "legacy"/"apps"
# (đặc thù repo này), nếu không các thư mục ẩn như .agents/ sẽ lọt vào lượt collect.
norecursedirs = [
    "*.egg", ".*", "build", "dist", "node_modules", "venv",
    "legacy", "apps", "data", "_bmad", "_bmad-output",
]
