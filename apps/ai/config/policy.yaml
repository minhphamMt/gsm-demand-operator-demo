# config/policy.yaml — NGUỒN NGƯỠNG DUY NHẤT (SPEC §3.3)
#
# Cấm hard-code ngưỡng trong bất kỳ module nào. Thiếu 1 key ⇒ app crash lúc boot
# (fail-fast, ARCHITECTURE.md §6.4). Chỉ src/common/policy.py được đọc file này.
#
# Đặc tả: docs/design/DATA_CONTRACT.md §5 · Task: T0.1
# Mọi giá trị `verified: false` là ĐỀ XUẤT của tài liệu, chưa được Data/BA/PM chốt —
# tra mã `assumption` trong ASSUMPTION register (DATA_CONTRACT.md §8) để biết ai duyệt, hạn nào.
version: "1.0"
frozen_at: "2026-08-08" # I-08 — sau mốc này chỉ thêm key mới, không đổi ngữ nghĩa key cũ

rules:
