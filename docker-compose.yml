services:
  ai:
    build:
      context: ./AI
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      MODEL_VERSION: live_snapshot_baseline_v1
    volumes:
      - ./AI/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backEnd
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backEnd/.env
    environment:
      AI_SERVICE_URL: http://ai:8000
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      ai:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontEnd
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - ./frontEnd/.env
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
