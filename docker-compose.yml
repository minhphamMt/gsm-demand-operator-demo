services:
  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      MODEL_VERSION: lgbm_quantile_v1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      AI_SERVICE_URL: http://ai:8000
      OPERATOR_DISPATCH_ENABLED: "true"
      OPERATOR_DISPATCH_SIMULATION_ENABLED: "true"
      OPERATOR_DISPATCH_SIMULATION_INTERVAL_MS: "2000"
      OPERATOR_ACTIVATION_ENABLED: "true"
      OPERATOR_SETTLEMENT_ENABLED: "true"
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
    depends_on:
      ai:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    env_file:
      - path: ./apps/frontend/.env
        required: true
      - path: ./apps/frontend/.env.local
        required: false
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_DATA_SOURCE: api
      VITE_DEMO_MODE: "false"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
